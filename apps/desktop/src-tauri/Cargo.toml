[package]
name = "desktop"
version = "0.1.14"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-powersync = "0.0.6"
# Same version tauri-plugin-powersync itself depends on (see
# ~/.cargo/registry/src/*/tauri-plugin-powersync-0.0.6/Cargo.toml) - needed
# directly here to name powersync::BackendConnector/SyncOptions/etc. in our
# own connector.rs, since tauri-plugin-powersync doesn't re-export them.
powersync = { version = "0.0.7", features = ["tokio", "reqwest"] }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2"
scrypt = "0.12.0"
hex = "0.4.3"

