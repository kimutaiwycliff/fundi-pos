# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Scoping confirmed against @powersync/service-sync-rules' own compiler
# source (not guessed): auth.parameter('x') desugars to
# auth.parameters() ->> '$.x', reading the custom claims Payload signs into
# each till's token (see apps/api/src/lib/powersyncAuth.ts). Column names
# are snake_case per Payload's Postgres adapter (tenant -> tenant_id, etc).
#
# Restart the powersync service after editing this file - changes are not
# hot-reloaded.
config:
  edition: 3

streams:
  # Business name + receipt header/footer text - a till needs this synced
  # down to print a receipt fully offline (spec's offline-first premise
  # would be undermined if a receipt's own letterhead required a live call).
  # Explicit column list: subscriptionTier/billingStatus are the SaaS
  # operator's own billing internals, not something every till needs.
  tenants:
    auto_subscribe: true
    query: |
      SELECT id, name, receipt_header, receipt_footer, created_at, updated_at
      FROM tenants WHERE id = auth.parameter('tenant_id')

  # Catalog data: shared across a tenant's stores, so it's tenant-scoped
  # only (spec Section 6.3: "centralized product catalog").
  products:
    auto_subscribe: true
    query: SELECT * FROM products WHERE tenant_id = auth.parameter('tenant_id')

  # Variant sub-rows of products (Payload normalizes the Products.variants
  # array field into this child table, same _parent_id/no-own-tenant-column
  # shape as orders_line_items below) - scoped by joining back to the
  # parent product's tenant, same tenant-only (not store) scoping as
  # products itself, since a variant's price isn't store-specific (only its
  # STOCK is, tracked via the already-synced, store-scoped stock_movements
  # ledger keyed by this row's own id in its `variant` text column).
  products_variants:
    auto_subscribe: true
    query: |
      SELECT pv.* FROM products_variants pv
      JOIN products p ON p.id = pv._parent_id
      WHERE p.tenant_id = auth.parameter('tenant_id')

  store_product_overrides:
    auto_subscribe: true
    query: |
      SELECT * FROM store_product_overrides
      WHERE tenant_id = auth.parameter('tenant_id') AND store_id = auth.parameter('store_id')

  customers:
    auto_subscribe: true
    query: SELECT * FROM customers WHERE tenant_id = auth.parameter('tenant_id')

  # Transactional / ledger data: a till only ever syncs its own store's rows
  # (spec Section 5: "Sync direction... a till only syncs its store's data").
  stock_movements:
    auto_subscribe: true
    query: |
      SELECT * FROM stock_movements
      WHERE tenant_id = auth.parameter('tenant_id') AND store_id = auth.parameter('store_id')

  orders:
    auto_subscribe: true
    query: |
      SELECT * FROM orders
      WHERE tenant_id = auth.parameter('tenant_id') AND store_id = auth.parameter('store_id')

  # orders_line_items has no tenant_id/store_id of its own (Payload
  # normalizes the Orders.lineItems array field into a child table keyed
  # only by _parent_id -> orders.id) - scope it by joining back to the
  # parent order's own tenant/store instead of denormalizing columns onto
  # the child table.
  orders_line_items:
    auto_subscribe: true
    query: |
      SELECT oli.* FROM orders_line_items oli
      JOIN orders o ON o.id = oli._parent_id
      WHERE o.tenant_id = auth.parameter('tenant_id') AND o.store_id = auth.parameter('store_id')

  # Org-level reference data a till needs for staff lookup/PIN login -
  # tenant-scoped, not store-scoped, since owners/managers can float
  # between stores.
  stores:
    auto_subscribe: true
    query: SELECT * FROM stores WHERE tenant_id = auth.parameter('tenant_id')

  # Explicit column list, not `SELECT *`: Payload's `users` table also holds
  # `hash`/`salt`/`reset_password_token` (its own admin-panel auth secrets).
  # Syncing those to every till would let a compromised/malicious terminal
  # exfiltrate every staff member's password hash for offline cracking -
  # caught by inspecting real synced data, not by inspection of the query
  # alone. A till only ever needs these columns for cashier lookup/PIN login.
  users:
    auto_subscribe: true
    query: |
      SELECT id, tenant_id, store_id, role, pin_hash, email, phone, name, status, created_at, updated_at
      FROM users WHERE tenant_id = auth.parameter('tenant_id')
