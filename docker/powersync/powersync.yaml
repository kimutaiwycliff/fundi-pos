# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
# Schema confirmed against https://github.com/powersync-ja/self-host-demo
# (demos/nodejs-postgres-bucket-storage) — only PS_-prefixed env vars can be
# substituted via `!env`.
telemetry:
  disable_telemetry_sharing: false

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience: ["hardware-pos-saas"]

api:
  tokens:
    # Only PS_-prefixed env vars can be substituted here (enforced by the
    # service itself - confirmed live: POWERSYNC_ADMIN_TOKEN was rejected
    # with "Variables must start with PS_", exactly what docker/.env.example's
    # own header comment already said, before this file was made to comply).
    - !env PS_ADMIN_TOKEN
