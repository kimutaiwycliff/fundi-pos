services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_saas}
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    # Logical replication (wal_level=logical) is required for PowerSync to
    # stream changes out of Postgres.
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PowerSync's OWN internal bucket-storage DB — deliberately separate from
  # the app DB above. Pattern confirmed against PowerSync's official
  # self-host-demo repo (demos/nodejs-postgres-bucket-storage).
  postgres-storage:
    image: postgres:16
    environment:
      POSTGRES_DB: powersync_storage
      POSTGRES_USER: powersync_storage
      POSTGRES_PASSWORD: ${POSTGRES_STORAGE_PASSWORD:-dev_only_change_me_2}
    volumes: ["pgdata_storage:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powersync_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Named fundi-payload-api, not payload-api: this stack shares an external
  # Docker network (pharmatrack_net, below) with a completely separate
  # compose project on the same host. Compose always registers a service's
  # own name as a network alias on EVERY network it joins - confirmed live,
  # this is NOT suppressed by also setting `networks.<net>.aliases`, so the
  # only reliable fix is giving the service itself a name that can't
  # collide with anything on the other project's side. This one wouldn't
  # have collided today, but is named consistently with fundi-web below,
  # which did.
  fundi-payload-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      # Next.js standalone's server.js binds to process.env.HOSTNAME, and
      # Docker auto-injects HOSTNAME=<container id> into every container -
      # without this override the server only accepts connections on that
      # specific container IP, never on localhost/127.0.0.1 (confirmed live:
      # a request from inside this same container to its own localhost:3000
      # got ECONNREFUSED, while the same request to the container's real
      # bridge IP succeeded). Harmless for container-name-based access
      # (Caddy's reverse_proxy resolves the real IP via Docker DNS anyway),
      # but any localhost-based healthcheck or same-container tooling needs
      # this to work at all.
      HOSTNAME: 0.0.0.0
      DATABASE_URI: postgres://${POSTGRES_USER:-pos_admin}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-pos_saas}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev_only_change_me_to_a_long_random_string}
      # Real deployed domains that need CORS/CSRF allowlisted - see
      # payload.config.ts's own comment for why the admin panel's own
      # origin has to be in this list too, not just apps/web's.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Required by apps/api/src/lib/powersyncAuth.ts - signs/serves the
      # PowerSync client-auth JWT and its JWKS. No dev default: a missing
      # value should fail loudly (requireEnv throws) rather than silently
      # run with a key nobody generated.
      POWERSYNC_JWT_PRIVATE_KEY: ${POWERSYNC_JWT_PRIVATE_KEY}
      POWERSYNC_JWT_PUBLIC_KEY: ${POWERSYNC_JWT_PUBLIC_KEY}
      POWERSYNC_JWT_KID: ${POWERSYNC_JWT_KID}
    ports: ["3001:3000"]
    networks: [default, pharmatrack_net]
    depends_on:
      postgres:
        condition: service_healthy

  # journeyapps/powersync-service:1.24.0 confirmed current as of 2026-08 via
  # https://hub.docker.com/r/journeyapps/powersync-service/tags — re-check at
  # build time per POS_SAAS_SPEC.md's own note, since tags do move.
  #
  # Named fundi-powersync - see fundi-payload-api's comment above for why.
  fundi-powersync:
    image: journeyapps/powersync-service:1.24.0
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_PORT: ${PS_PORT:-8080}
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_STORAGE_SOURCE_URI: ${PS_STORAGE_SOURCE_URI}
      PS_JWKS_URL: ${PS_JWKS_URL}
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN}
    volumes:
      - ./powersync:/config:ro
    ports: ["8080:8080"]
    networks: [default, pharmatrack_net]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-storage:
        condition: service_healthy

  # Named fundi-web, not web: pharmatrack's OWN compose project also has a
  # service literally named `web` - this is the collision that actually
  # happened live (pharmatrack.co.ke briefly served this app's landing page
  # because Docker's embedded DNS had two containers registered under the
  # same alias on the shared network). See fundi-payload-api's comment
  # above for the full mechanism.
  fundi-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      # See fundi-payload-api's identical HOSTNAME override above for why.
      HOSTNAME: 0.0.0.0
      # Browser-facing (client-side fetches) - the browser runs on the host,
      # so it must use the host-mapped port, not the container-internal one.
      # Overridable so a production .env can point this at the real public
      # API domain instead - Next.js inlines NEXT_PUBLIC_* at build time, so
      # changing this always requires a rebuild, not just a restart.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # Public R2 bucket desktop-release.yml (GitHub Actions) uploads
      # Windows/macOS installers to - same NEXT_PUBLIC_* build-time caveat
      # as above.
      NEXT_PUBLIC_DOWNLOADS_BASE_URL: ${NEXT_PUBLIC_DOWNLOADS_BASE_URL:-}
      # Server-side (Next.js route handlers running inside this container) -
      # reaches fundi-payload-api over the compose network's internal
      # DNS/port, never the host-mapped 3001. Caught live: without this,
      # every server-side call defaulted to apps/web's own hardcoded
      # host-dev fallback (http://localhost:3011) and failed with
      # ECONNREFUSED inside the container, since nothing listens on 3011 in
      # this network.
      PAYLOAD_API_URL: http://fundi-payload-api:3000
    ports: ["3000:3000"]
    networks: [default, pharmatrack_net]
    depends_on: [fundi-payload-api]

volumes:
  pgdata:
  pgdata_storage:

networks:
  default: {}
  # Pre-existing network pharmatrack's own Caddy container is already on -
  # joining it (not replacing our own `default` network) is what lets that
  # Caddy reach fundi-payload-api/fundi-web/fundi-powersync by container
  # name, without this stack's Postgres instances ever being reachable from
  # pharmatrack's side.
  pharmatrack_net:
    external: true
    name: pharmatrack_default
