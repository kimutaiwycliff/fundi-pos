services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_saas}
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    # Logical replication (wal_level=logical) is required for PowerSync to
    # stream changes out of Postgres.
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PowerSync's OWN internal bucket-storage DB — deliberately separate from
  # the app DB above. Pattern confirmed against PowerSync's official
  # self-host-demo repo (demos/nodejs-postgres-bucket-storage).
  postgres-storage:
    image: postgres:16
    environment:
      POSTGRES_DB: powersync_storage
      POSTGRES_USER: powersync_storage
      POSTGRES_PASSWORD: ${POSTGRES_STORAGE_PASSWORD:-dev_only_change_me_2}
    volumes: ["pgdata_storage:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powersync_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  payload-api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-pos_admin}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-pos_saas}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev_only_change_me_to_a_long_random_string}
    ports: ["3001:3000"]
    depends_on:
      postgres:
        condition: service_healthy

  # journeyapps/powersync-service:1.24.0 confirmed current as of 2026-08 via
  # https://hub.docker.com/r/journeyapps/powersync-service/tags — re-check at
  # build time per POS_SAAS_SPEC.md's own note, since tags do move.
  powersync:
    image: journeyapps/powersync-service:1.24.0
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_PORT: ${PS_PORT:-8080}
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_STORAGE_SOURCE_URI: ${PS_STORAGE_SOURCE_URI}
      PS_JWKS_URL: ${PS_JWKS_URL}
    volumes:
      - ./powersync:/config:ro
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-storage:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ["3000:3000"]
    depends_on: [payload-api]

volumes:
  pgdata:
  pgdata_storage:
