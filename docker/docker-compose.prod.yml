# VPS production overrides (build plan Phase 9, target 3). Run alongside the
# base file, never alone - it only adds restart policies, resource limits,
# a Caddy reverse proxy with automatic TLS, and a backup cron:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The backup/restore.sh round trip (pg_dump --clean --if-exists, gzip,
# rotation, and a full restore back into both an empty AND an
# already-populated database) has been verified end-to-end against a real
# copy of this project's schema and data - see docker/RESTORE.md. Still
# unverified in this environment: Caddy's TLS issuance and the actual R2
# network upload/download, since both need real public DNS / object-storage
# credentials this environment doesn't have.
services:
  postgres:
    restart: unless-stopped
    # Never expose raw Postgres to the host/internet in production - only
    # other containers on this compose's own network need to reach it.
    # (The base file's 5433:5432 mapping is dev-only, for psql from the host.)
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  postgres-storage:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  fundi-payload-api:
    restart: unless-stopped
    # Not published directly in production - Caddy is the only public
    # entrypoint (see the caddy service below).
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  fundi-powersync:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  fundi-web:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # This service is intentionally never actually brought up on a box that
  # already has its own Caddy (e.g. pharmatrack's) - see docker/README.md.
  # Kept here, correctly configured, for a genuinely standalone/dedicated
  # VPS deployment.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
      POWERSYNC_DOMAIN: ${POWERSYNC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    command: ["caddy", "run", "--config", "/etc/caddyfile"]
    ports: ["80:80", "443:443"]
    depends_on: [fundi-payload-api, fundi-web, fundi-powersync]

  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    # No cron daemon in the postgres image - a plain sleep loop is simpler
    # than adding one for a single daily job. Installs aws-cli on first
    # boot since the base image doesn't include it (see backup.sh).
    command:
      - |
        apt-get update && apt-get install -y --no-install-recommends awscli && rm -rf /var/lib/apt/lists/*
        while true; do
          sh /backup.sh
          sleep 86400
        done
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-pos_admin}:${POSTGRES_PASSWORD:-dev_only_change_me}@postgres:5432/${POSTGRES_DB:-pos_saas}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      # aws-cli itself only understands the plain AWS_* names - mapped in
      # from the BACKUP_S3_-prefixed vars above so docker/.env never has to
      # hold a bare, easily-confused-with-something-else AWS_ACCESS_KEY_ID.
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # aws-cli requires some region even for S3-compatible providers that
      # don't have real AWS regions - Cloudflare R2's own docs specify "auto".
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./restore.sh:/restore.sh:ro
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  pgbackups:
