name: Deploy to production

# Gated on CI (not a plain push trigger) so a change that fails lint/test/
# build/typecheck/e2e never reaches the server - deploys the exact commit
# CI validated (workflow_run.head_sha), not whatever main happens to be
# when this workflow starts.
#
# Mirrors the manual deploy process used before this pipeline existed:
# rsync the workspace to the server, then rebuild+recreate just the
# fundi-payload-api/fundi-web containers via the same docker compose files
# used locally. Deliberately no registry/image-push step - the server
# builds its own image from source over SSH, same as always.
#
# The server is co-located with a separate, unrelated production app behind
# a shared Caddy reverse proxy - this workflow only ever touches fundi's own
# containers (build + up -d two named services), never Caddy or that other
# app's containers/network, and verifies that other app's containers are
# still healthy after every deploy as a regression check. (The other app's
# name is a third party's infrastructure detail, kept out of this repo -
# see the COLOCATED_APP_NAME secret used below.)
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync workspace to server
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=15" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '*.pem' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'docker/.env' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '.nx' \
            --exclude '*.tsbuildinfo' \
            --exclude 'apps/desktop/src-tauri/target' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Free disk space on deploy host
        # Every deploy rebuilds fundi-payload-api/fundi-web from source on
        # the server itself (see this workflow's own header comment) -
        # each build leaves the previous image's now-unreferenced layers
        # and build cache behind, and nothing ever reclaimed them. Caught
        # live: the server ran out of disk mid-build (`npm ci` failing with
        # ENOSPC) on back-to-back deploys.
        #
        # `docker image prune -af` + `docker builder prune -af` only, NOT
        # `docker system prune` - system prune also unconditionally sweeps
        # unused networks, and this box's `colocated_net` (docker-compose.
        # yml's own network block) is an *external* network this stack
        # only joins, owned and created by a completely separate co-located
        # app's own compose project. `docker network rm`/prune normally
        # refuses to remove a network with active container endpoints, but
        # this box is shared infrastructure this workflow doesn't fully
        # control the state of - not worth the risk of taking down a third
        # party's app over reclaiming a few hundred MB of network objects,
        # which were never the actual disk hog here anyway (images/build
        # cache were). Neither of these two commands ever touches a
        # network, a container, or a volume - only unreferenced image
        # layers and build cache, so still safe to run unconditionally on
        # every deploy.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker image prune -af && docker builder prune -af"

      - name: Build and restart containers
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/docker' && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml build fundi-payload-api fundi-web && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans fundi-payload-api fundi-web"
          # --remove-orphans stops and removes any container this compose
          # project previously started for a service no longer declared in
          # the compose files (e.g. fundi-powersync/postgres-storage, removed
          # when PowerSync was decommissioned) - without it, a container for
          # a since-deleted service keeps running indefinitely, since `up -d`
          # only ever acts on the services it's told about.

      - name: Verify fundi health
        run: |
          set -euo pipefail
          sleep 10
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$1")
            echo "$1 -> $code"
            [ "$code" = "200" ]
          }
          fail=0
          check "https://app.fundipos.co.ke/" || fail=1
          check "https://api.fundipos.co.ke/admin" || fail=1
          if [ "$fail" = "1" ]; then
            echo "::error::Post-deploy health check failed - see above. This does NOT auto-rollback; investigate and roll back manually if needed."
            exit 1
          fi

      - name: Apply pending Payload migrations
        # Runs after the health check on purpose - confirms the app is up
        # on its current schema before touching the database, and (per
        # docker/migrate.sh's own comment) this can never hang the API
        # itself since it never runs inside fundi-payload-api's own boot.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && bash docker/migrate.sh"

      - name: Verify the co-located app is unaffected
        # A separate, unrelated app shares the same box/Caddy - this deploy
        # never touches its containers or network, so this should always
        # pass; it exists to catch a regression in the same step that would
        # introduce one, not later. Checked over SSH via `docker ps` (not a
        # public HTTPS curl from the runner) - the first real run of this
        # pipeline hit a false positive here: Cloudflare's WAF returned 403 to
        # the GitHub Actions runner's datacenter IP even though the other app
        # was genuinely healthy (confirmed 200 from an unrelated IP at the
        # same moment). Container status is a direct, WAF-immune signal of
        # whether this deploy actually affected the other app, which is the
        # only thing this check can meaningfully attest to anyway. Its name
        # (COLOCATED_APP_NAME secret) identifies a third party's
        # infrastructure, so it's kept as a secret rather than hardcoded.
        run: |
          set -euo pipefail
          bad=$(ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker ps --filter 'name=${{ secrets.COLOCATED_APP_NAME }}' --format '{{.Names}}\t{{.Status}}'" | tee /dev/stderr | grep -v -E 'Up ' || true)
          if [ -n "$bad" ]; then
            echo "::error::co-located app container(s) not in an Up state after this deploy - see above. This does NOT auto-rollback; investigate immediately."
            exit 1
          fi
