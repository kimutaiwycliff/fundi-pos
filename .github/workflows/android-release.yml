name: Build and release Android app

# Mirrors desktop-release.yml's own pattern for distribution: not EAS's paid
# cloud build service (self-host everything, same as PowerSync/R2 backups),
# and the same public-R2-bucket distribution (this repo is private,
# downloads need to be public) instead of GitHub Releases.
#
# Builds via `eas build --local` rather than a raw `expo prebuild` +
# `gradlew assembleRelease` - confirmed empirically (two real local builds)
# that this project's generated android/app/build.gradle has NO env-var-
# driven release signingConfig at all (`release` uses the debug keystore
# directly unless something patches it). `eas build --local` is what
# already correctly signs every local production build on this machine: it
# reads apps/mobile/credentials.json and actively injects the real signing
# config into build.gradle as one of its own build phases
# ("Injecting signing config into build.gradle" in its own log output)
# before Gradle ever runs. This workflow reconstructs that same
# credentials.json from secrets rather than reimplementing Gradle signing
# by hand, so CI produces a byte-for-byte-equivalent signing setup to what
# already works locally.
#
# Signing keystore is a one-way door (Android treats a differently-signed
# APK as a conflicting app, not an update) - ANDROID_KEYSTORE_BASE64 is the
# base64 of the SAME keystore already used for this project's local
# production builds (apps/mobile/credentials/preview.keystore), not a new
# one, with ANDROID_KEY_ALIAS/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_PASSWORD
# matching apps/mobile/credentials.json. Never rotate these independently of
# that local file - they must always describe the exact same keystore.
#
# EXPO_TOKEN: `eas build`, even fully local, resolves this project's
# "production" Environment Variables from EAS's own dashboard (that's where
# EXPO_PUBLIC_API_BASE_URL/EXPO_PUBLIC_POWERSYNC_URL for a production build
# actually come from - apps/mobile's local .env is dev-only/localhost, and
# eas.json has no inline env block). That resolution needs an authenticated
# EAS session even for a fully local build. Generate a personal access token
# at https://expo.dev (account settings -> Access Tokens) for the account
# these builds should run as, and set it as the EXPO_TOKEN secret - eas-cli
# reads that env var automatically in non-interactive mode. There is no
# CLI command to mint this token (confirmed: no `token:create` in this
# eas-cli version), so it has to come from the dashboard.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # Confirmed live: the previous run got past every earlier step (10m47s
      # in, well into the actual build) and died with "No space left on
      # device". ubuntu-latest's default free space (~14GB) isn't enough for
      # this monorepo's npm install + an Android/Gradle release build once
      # you add in the runner image's large pre-installed toolchains this
      # job never uses (.NET, Haskell, etc). android: false keeps the
      # Android SDK this job actually needs (default is to remove it too);
      # this has to run before setup-node/setup-java below, or tool-cache
      # removal would delete the JDK those steps are about to install.
      - uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npx nx run mobile:build-deps

      - name: Reconstruct local signing credentials
        # Same file eas-cli reads locally (apps/mobile/credentials.json,
        # gitignored - never committed) - rebuilt here from secrets so this
        # job signs with the exact same keystore as every local production
        # build, not a separately-managed one.
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p credentials
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > credentials/preview.keystore
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "credentials/preview.keystore",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Build signed release APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist-upload"
          # Bare `npx eas` fails on a cold npx cache in a non-interactive
          # shell (confirmed live: "npm error could not determine executable
          # to run", exit in ~3s - too fast to have even attempted a real
          # install). It only ever worked locally because this machine's
          # npx cache already had eas-cli resolved from earlier interactive
          # use. `--yes` plus the real package name (not relying on npx to
          # guess "eas" -> "eas-cli") makes the auto-install explicit.
          npx --yes eas-cli build --platform android --profile production --local --non-interactive \
            --output "$GITHUB_WORKSPACE/dist-upload/FundiTill.apk"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          # Read from app.json rather than the git ref, so a plain
          # workflow_dispatch rebuild (no android-v* tag) still writes a
          # real semver into android-version.json instead of a branch name.
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          aws s3 cp dist-upload/FundiTill.apk \
            "s3://${{ secrets.R2_RELEASES_BUCKET }}/latest/FundiTill.apk" \
            --endpoint-url "${{ secrets.R2_RELEASES_ENDPOINT }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            aws s3 cp dist-upload/FundiTill.apk \
              "s3://${{ secrets.R2_RELEASES_BUCKET }}/v${VERSION}/FundiTill.apk" \
              --endpoint-url "${{ secrets.R2_RELEASES_ENDPOINT }}"
          fi
          cat > android-version.json <<EOF
          {"version": "${VERSION}", "android": "FundiTill.apk"}
          EOF
          aws s3 cp android-version.json \
            "s3://${{ secrets.R2_RELEASES_BUCKET }}/latest/android-version.json" \
            --endpoint-url "${{ secrets.R2_RELEASES_ENDPOINT }}"
