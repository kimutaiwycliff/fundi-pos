name: Provision R2 env on production

# One-off, manually-triggered - not part of the regular deploy.yml pipeline.
# Writes the R2_* secrets (plus NEXT_PUBLIC_DOWNLOADS_BASE_URL, the public
# URL of that same R2 releases bucket - not sensitive, so it's written
# directly rather than needing its own secret) into the production server's
# own docker/.env (excluded from deploy.yml's rsync on purpose, so it has to
# be seeded here instead), then rebuilds+recreates fundi-payload-api and
# fundi-web so both pick up the new env. fundi-web needs an actual rebuild,
# not just a restart - NEXT_PUBLIC_* is inlined into its bundle at build
# time (see apps/web/Dockerfile's ARG/ENV lines), so a plain restart alone
# would leave it serving the stale (empty) value. Safe to re-run: strips any
# existing R2_/NEXT_PUBLIC_DOWNLOADS_BASE_URL lines from docker/.env before
# appending fresh ones, rather than accumulating duplicates.
on:
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build local env snippet
        run: |
          set -euo pipefail
          {
            echo "R2_BUCKET=${{ secrets.R2_BUCKET }}"
            echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
            echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
            echo "R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}"
            echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}"
            echo "NEXT_PUBLIC_DOWNLOADS_BASE_URL=https://pub-e6776728912f415583a924395bffb6d4.r2.dev"
          } > /tmp/r2-env-snippet

      - name: Upload snippet and update docker/.env on the server
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -o ConnectTimeout=15 /tmp/r2-env-snippet \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/r2-env-snippet"
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
              set -euo pipefail
              ENV_FILE="${{ secrets.DEPLOY_PATH }}/docker/.env"
              grep -v -E "^(R2_|NEXT_PUBLIC_DOWNLOADS_BASE_URL=)" "$ENV_FILE" > "$ENV_FILE.tmp" 2>/dev/null || : > "$ENV_FILE.tmp"
              cat /tmp/r2-env-snippet >> "$ENV_FILE.tmp"
              mv "$ENV_FILE.tmp" "$ENV_FILE"
              rm -f /tmp/r2-env-snippet
            '
          rm -f /tmp/r2-env-snippet

      - name: Rebuild fundi-web and restart fundi-payload-api to pick up new env
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}/docker' && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml build fundi-web && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d fundi-payload-api fundi-web"

      - name: Verify fundi API health
        run: |
          set -euo pipefail
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://api.fundipos.co.ke/admin")
          echo "api.fundipos.co.ke/admin -> $code"
          [ "$code" = "200" ]

      - name: Verify pharmatrack is unaffected
        # Same reasoning as deploy.yml's own equivalent step - this workflow
        # only ever touches fundi's own containers (fundi-payload-api,
        # fundi-web), but checked over SSH (not a public HTTPS curl) since
        # Cloudflare's WAF has previously 403'd the Actions runner's own IP
        # even when pharmatrack was genuinely healthy.
        run: |
          set -euo pipefail
          bad=$(ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker ps --filter 'name=pharmatrack' --format '{{.Names}}\t{{.Status}}'" | tee /dev/stderr | grep -v -E 'Up ' || true)
          if [ -n "$bad" ]; then
            echo "::error::pharmatrack container(s) not in an Up state after this - see above."
            exit 1
          fi
