name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # apps/api's own integration tests (collections.integration.test.ts,
    # phase6.integration.test.ts) call getPayload({config}) against a real
    # Postgres - this job never provisioned one, so `nx run-many -t test`
    # has been failing with "cannot connect to Postgres" since this
    # workflow was first generated, unrelated to any app code change.
    # payload.config.ts's db adapter has no explicit `push` setting, so it
    # uses Payload's own default (schema auto-push whenever NODE_ENV isn't
    # 'production', which it isn't here) - no separate migration step
    # needed, just a real reachable database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pos_saas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/pos_saas_test
      PAYLOAD_SECRET: ci-test-secret-never-used-outside-this-job
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: npx nx record -- npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
