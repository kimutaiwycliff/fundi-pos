# Render Blueprint - demo deployment (build plan Phase 9, target 2).
# UNVERIFIED against a real Render account (no credentials in this
# environment) - shaped from Render's published Blueprint spec
# (render.com/docs/blueprint-spec). Known demo-only limitations:
#   - Render's free Postgres plan expires after 30 days and must be
#     recreated - fine for a demo, not for anything meant to persist.
#   - Free-tier web services cold-start after inactivity; the till's offline
#     queue absorbs this (a slow sync is not a lost sale), but expect a
#     multi-second delay on the first request after idling.
# For anything meant to stay up, use docker-compose.prod.yml on a VPS instead.
databases:
  - name: pos-saas-db
    databaseName: pos_saas
    user: pos_admin
    plan: free

services:
  - type: web
    name: pos-saas-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /admin/login
    plan: free
    envVars:
      - key: DATABASE_URI
        fromDatabase:
          name: pos-saas-db
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true

  - type: web
    name: pos-saas-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: pos-saas-api
          property: hostport
